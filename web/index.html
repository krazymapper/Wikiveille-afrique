<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Veille quotidienne des nouveaux articles Wikipédia FR/EN et éléments Wikidata liés à l'Afrique." />
    <title>Wikiveille Afrique</title>
    <script>
      // Applique le thème choisi avant le premier rendu (évite le flash clair → sombre).
      try { var t = localStorage.getItem("wikiveille-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ce tableau de bord nécessite JavaScript. Les données brutes sont dans data/latest/.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
