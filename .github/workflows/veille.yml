name: Veille

on:
  schedule:
    - cron: "5 7 * * *"   # édition de 7h UTC
    - cron: "5 13 * * *"  # mise à jour de 13h UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Passage"
        type: choice
        options: [auto, matin, midi]
        default: auto
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/veille.yml"]

permissions:
  contents: write   # pousser la branche data
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

env:
  DATA_DIR: ${{ github.workspace }}/_data

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Récupérer les données existantes (branche data)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DATA_DIR"
          else
            echo "Branche data absente : amorçage avec seed/historique.json"
            mkdir -p "$DATA_DIR" && cp seed/historique.json "$DATA_DIR/historique.json"
          fi

      - name: Collecter (une relance après 60 s si l'API échoue)
        env:
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: |
          for attempt in 1 2; do
            python collector/veille.py --mode "$MODE" --data-dir "$DATA_DIR" --archive-days 30 && exit 0
            [ "$attempt" = 1 ] && { echo "::warning::échec, nouvelle tentative dans 60 s"; sleep 60; }
          done
          exit 1

      - name: Publier sur la branche data (un seul commit, écrasé à chaque passage)
        working-directory: ${{ env.DATA_DIR }}
        run: |
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "données : $(jq -r .id latest/meta.json)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

  build:
    needs: collect
    if: always() && needs.collect.result != 'failure' && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Données publiées
        id: data
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: data
          path: web/public/data

      - name: Repli sur les données d'exemple
        run: |
          rm -rf web/public/data/.git
          if [ ! -f web/public/data/latest/meta.json ]; then cp -r seed/sample/. web/public/data/; fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Construire
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
